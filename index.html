<!doctype html>
<html lang="ru">
  <head>

          <div class="nav__block">
            <a href="#" class="nav__logo">LOGO</a>
          </div>
          <ul class="nav__list">
            <li class="nav__item">
              <a href="#" class="nav__link nav__link--active">Main</a>
            </li>
            <li class="nav__item">
              <a href="#" class="nav__link nav__link--disabled">About us</a>

            <li class="nav__item">

            <li class="nav__item">

      <ul class="features__list">
        <li class="features__item features__item--highlite">
          <a href="#" class="features__link">Fast performance</a>
        </li>
        <li class="features__item">
          <a href="#" class="features__link features__link--new" data-badge="NEW">Modern UI</a>
        </li>
        <li class="features__item">
          <a href="#" class="features__link features__link--disabled">Comming soon</a>
